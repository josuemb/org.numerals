plugins {
    id 'groovy'
    id 'eclipse'
    id 'application'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

group = 'io.github.josuemb'
version = '0.1.0'

application {
    mainClass = "org.numerals.Console"
}

defaultTasks 'clean', 'build'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'org.apache.groovy', name: 'groovy', version: '5.1.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The sources are Groovy, so the standard javadoc task produces an empty jar.
// Repackage the javadoc jar (created by the maven-publish plugin) from the
// groovydoc output instead, so consumers get real API documentation.
// The jar task is registered by the plugin later, so configure it lazily.
tasks.matching { it.name == 'mavenPlainJavadocJar' }.configureEach {
    dependsOn tasks.named('groovydoc')
    from tasks.named('groovydoc').map { it.destinationDir }
}

mavenPublishing {
    // Publish to the Central Portal (the new Sonatype flow). Without an explicit
    // host the plugin defaults to the legacy OSSRH/Nexus staging API, which
    // returns "Cannot get stagingProfiles ... (402)" for Central Portal
    // namespaces like io.github.josuemb, and automatically release after upload.
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)

    // Only sign when signing credentials are present, so local and CI builds do not fail.
    if (project.findProperty('signingInMemoryKey') || System.getenv('ORG_GRADLE_PROJECT_signingInMemoryKey')) {
        signAllPublications()
    }

    coordinates(group.toString(), 'numerals', version.toString())

    pom {
        name = 'numerals'
        description = 'API for easy numerals (cardinal numbers) generation across multiple locales.'
        url = 'https://github.com/josuemb/org.numerals'
        inceptionYear = '2011'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'josuemb'
                name = 'Josue Martinez Buenrrostro'
                url = 'https://github.com/josuemb'
            }
        }

        scm {
            url = 'https://github.com/josuemb/org.numerals'
            connection = 'scm:git:https://github.com/josuemb/org.numerals.git'
            developerConnection = 'scm:git:ssh://git@github.com/josuemb/org.numerals.git'
        }
    }
}
